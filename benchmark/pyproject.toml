[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "smartdata-data-path-benchmark"
version = "1.0.0"
description = "Reproducible PostgreSQL and ClickHouse result-delivery benchmark"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "adbc-driver-flightsql==1.12.0", "adbc-driver-manager==1.4.0",
  "adbc-driver-postgresql==1.4.0", "clickhouse-connect==0.8.9",
  "clickhouse-driver==0.2.9", "connectorx==0.4.5", "duckdb==1.2.2",
  "lz4==4.4.4", "numpy==2.5.2", "pandas==2.2.3", "polars==1.44.1",
  "psycopg[binary]==3.2.6", "pyarrow==19.0.1", "pymysql==1.1.2",
  "mysqlclient==2.2.7", "sqlalchemy==2.0.52", "zstandard==0.25.0",
  "openpyxl==3.1.5"
]
[project.scripts]
smartdata-benchmark = "benchmark.cli:main"
[tool.setuptools.packages.find]
include = ["benchmark*"]
